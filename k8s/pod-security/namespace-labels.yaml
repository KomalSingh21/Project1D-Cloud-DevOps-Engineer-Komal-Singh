# FinServ Digital — Pod Security Standards namespace labels
# Restricted is the target workload security tier.
# Audit and warn are retained to expose violations during rollout.

apiVersion: v1
kind: Namespace
metadata:
  name: finserv-dev-payments
  labels:
    finserv.io/environment: dev
    finserv.io/domain: payments
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
