apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: finserv-image-hygiene
  annotations:
    policies.kyverno.io/title: FinServ image hygiene
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-approved-registry
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Production workloads must use the approved FinServ image registry."
        pattern:
          spec:
            containers:
              - image: "ghcr.io/finserv-digital/*"
    - name: disallow-latest
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "The latest tag is not permitted. Use an immutable image digest."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: EndsWith
                    value: ":latest"
