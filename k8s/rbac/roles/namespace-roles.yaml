# Namespace Administrator role — deliberately namespace-scoped.
# The same role is applied through bindings to the assigned namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: finserv-namespace-administrator
rules:
- apiGroups: ["", "apps", "batch", "autoscaling"]
  resources: ["pods", "services", "configmaps", "deployments", "replicasets", "statefulsets", "jobs", "cronjobs", "horizontalpodautoscalers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Developer role for non-production namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: finserv-developer-nonprod
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
# Developer role for production: no pod exec and no secret access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: finserv-developer-prod
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
# CI/CD role. Secret values are intentionally excluded.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: finserv-cicd-deployer
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["services", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
