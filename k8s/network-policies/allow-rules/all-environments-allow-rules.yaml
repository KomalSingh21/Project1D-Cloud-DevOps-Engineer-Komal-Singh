apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gateway-to-user-management
  namespace: finserv-dev-customer
  annotations:
    security.finserv.io/rationale: "Required application dependency from api-gateway to user-management on TCP 8443"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: user-management
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          finserv.io/environment: dev
          finserv.io/domain: customer
      podSelector:
        matchLabels:
          app.kubernetes.io/name: api-gateway
    ports:
    - protocol: TCP
      port: 8443
---
