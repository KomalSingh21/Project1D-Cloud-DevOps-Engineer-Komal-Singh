apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: transaction-processor
  namespace: finserv-prod-payments
spec:
  host: transaction-processor.finserv-prod-payments.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 20
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: transaction-processor-canary
  namespace: finserv-prod-payments
spec:
  hosts:
    - transaction-processor.finserv-prod-payments.svc.cluster.local
  http:
    - name: canary-route
      route:
        - destination:
            host: transaction-processor.finserv-prod-payments.svc.cluster.local
            subset: v1
          weight: 90
        - destination:
            host: transaction-processor.finserv-prod-payments.svc.cluster.local
            subset: v2
          weight: 10
      timeout: 3s
      retries:
        attempts: 2
        perTryTimeout: 1s
        retryOn: connect-failure,reset,5xx
