apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-gateway-vault-example
  namespace: finserv-prod-payments
  labels:
    app.kubernetes.io/name: payment-gateway-vault-example
    finserv.io/domain: payments
    example.finserv.io/deployable: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway-vault-example
  namespace: finserv-prod-payments
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-gateway-vault-example
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-gateway-vault-example
        finserv.io/domain: payments
        finserv.io/environment: prod
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "finserv-prod-payments"
        vault.hashicorp.com/agent-inject-secret-payment-config: "secret/data/payments/payment-gateway"
        vault.hashicorp.com/agent-inject-template-payment-config: |
          {{- with secret "secret/data/payments/payment-gateway" -}}
          {
            "processor_url": "{{ .Data.data.processor_url }}",
            "client_id": "{{ .Data.data.client_id }}"
          }
          {{- end }}
    spec:
      serviceAccountName: payment-gateway-vault-example
      containers:
        - name: payment-gateway-vault-example
          image: ghcr.io/finserv-digital/payment-gateway@sha256:REPLACE_WITH_RELEASE_DIGEST
          ports:
            - name: https
              containerPort: 8443
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
# Illustrative integration example only.
# The image digest and Vault role must be replaced with approved production values.
