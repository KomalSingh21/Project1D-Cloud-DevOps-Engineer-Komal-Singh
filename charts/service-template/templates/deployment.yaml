apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finserv-service.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "finserv-service.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "finserv-service.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "finserv-service.name" . }}
      annotations:
        vault.hashicorp.com/agent-inject: {{ .Values.vault.enabled | quote }}
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-config: {{ .Values.vault.secretPath | quote }}
    spec:
      serviceAccountName: {{ default (include "finserv-service.fullname" .) .Values.serviceAccount.name }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
